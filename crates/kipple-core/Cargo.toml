[package]
name = "kipple-core"
description = "kipple's domain model, policy and engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `DeleteOp::for_platform_tests` and `TrashOp::for_platform_tests`, for the platform's
# native executor and trash tests, and `ReviewedPlan::for_core_tests`, for this crate's
# apply tests. Only ever a dev-dependency feature: `cargo xtask check-arch` fails on any
# other use.
platform-tests = []

[dependencies]
crossbeam-channel.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# `kipple-platform`'s dev-dependency turns the feature on in a workspace test run.
[[test]]
name = "apply"
required-features = ["platform-tests"]

[lints]
workspace = true
