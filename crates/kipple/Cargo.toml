[package]
name = "kipple"
description = "Find what your tools leave behind and keep what matters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The hidden `KIPPLE_TEST_ROOTS` override `cargo xtask verify-demo` scans with. Never in a
# release build.
test-roots = ["kipple-platform/test-roots"]

[dependencies]
clap.workspace = true
kipple-adapters.workspace = true
kipple-core.workspace = true
kipple-platform.workspace = true
ratatui.workspace = true
schemars.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
toml_edit.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true

[[test]]
name = "scan"
required-features = ["test-roots"]

[[test]]
name = "config"
required-features = ["test-roots"]

[[test]]
name = "onboarding"
required-features = ["test-roots"]

[lints]
workspace = true
