[package]
name = "kipple-platform"
description = "kipple's operating-system facts, probes and confined executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# The hidden `KIPPLE_TEST_ROOTS` override for end-to-end tests. Never in a release build.
test-roots = []

[dependencies]
kipple-core.workspace = true
rayon.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Wdk_System_SystemServices",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_System_ProcessStatus",
  "Win32_System_RemoteDesktop",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Shell",
] }

[dev-dependencies]
# The native executor tests hand it operations the apply loop would never make.
kipple-core = { workspace = true, features = ["platform-tests"] }
tempfile.workspace = true

[lints]
workspace = true
