name: Bench

# Benchmarks on a disposable runner VM (docs/11-delivery-plan.md, S3 procedure). Manual
# only: it never runs on push or pull requests and is not part of the gate.
on:
  workflow_dispatch:
    inputs:
      entries:
        description: Entries in the reference tree
        type: choice
        options: ["100000", "1000000"]
        default: "100000"
      runs:
        description: Measured runs per command, cold and warm
        type: number
        default: 5
      commands:
        description: >-
          Commands to measure, separated by ";", run from the workspace root after a release
          build. Words are split on spaces and {tree} becomes the tree path.
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install strace and GNU time
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends strace time

      - name: Build
        run: cargo build --release --locked --workspace

      - name: Build the reference tree
        env:
          ENTRIES: ${{ inputs.entries }}
        run: cargo xtask bench-tree "$RUNNER_TEMP/tree" --entries "$ENTRIES"

      - name: Describe the machine
        run: |
          {
            echo "## Machine"
            echo '```text'
            echo "Runner image: $ImageOS $ImageVersion"
            uname -srm
            grep -m1 'model name' /proc/cpuinfo
            echo "CPUs: $(nproc)"
            free -h | head -n2
            df -hT "$RUNNER_TEMP" | tail -n1
            lsblk -d -o NAME,MODEL,ROTA,SIZE
            strace -V | head -n1
            /usr/bin/time --version
            python3 --version
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Cold runs
        env:
          ENTRIES: ${{ inputs.entries }}
          RUNS: ${{ inputs.runs }}
          COMMANDS: ${{ inputs.commands }}
        run: |
          IFS=';' read -ra commands <<<"$COMMANDS"
          {
            echo "## Cold, $ENTRIES entries, page cache dropped before every run"
            python3 -I .github/scripts/bench.py cold "$RUNNER_TEMP/tree" "$RUNS" "${commands[@]}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Warm runs
        env:
          ENTRIES: ${{ inputs.entries }}
          RUNS: ${{ inputs.runs }}
          COMMANDS: ${{ inputs.commands }}
        run: |
          IFS=';' read -ra commands <<<"$COMMANDS"
          {
            echo "## Warm, $ENTRIES entries"
            python3 -I .github/scripts/bench.py warm "$RUNNER_TEMP/tree" "$RUNS" "${commands[@]}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Spike branch only (spike/m1-s2-s3): S2 on all three OSes. Never merged to main.
  s2:
    name: s2 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Build
        run: cargo build --release --locked -p s2-procid

      - name: Snapshot
        shell: bash
        run: |
          {
            echo "## S2 snapshot (${{ matrix.os }}, $ImageOS $ImageVersion)"
            echo '```text'
            target/release/s2-procid snapshot 21
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Scenarios
        shell: bash
        run: |
          {
            echo "## S2 scenarios (${{ matrix.os }})"
            echo '```text'
            target/release/s2-procid scenarios
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Snapshot with /proc hiding other users' processes
        if: runner.os == 'Linux'
        run: |
          sudo mount -o remount,hidepid=invisible /proc
          {
            echo "## S2 snapshot with hidepid=invisible (Linux)"
            echo '```text'
            target/release/s2-procid snapshot 3
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Spike branch only: S3 warm runs on macOS and Windows, self-timed (no GNU time there).
  s3-warm:
    name: s3 warm (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Build
        run: cargo build --release --locked -p s3-walk

      - name: Build the reference tree
        shell: bash
        env:
          ENTRIES: ${{ inputs.entries }}
        run: cargo xtask bench-tree "$RUNNER_TEMP/tree" --entries "$ENTRIES"

      - name: Describe the machine
        shell: bash
        run: |
          echo "Runner image: $ImageOS $ImageVersion"
          if [[ $RUNNER_OS == macOS ]]; then
            sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize
            df -h "$RUNNER_TEMP" | tail -n1
            diskutil info / | grep -E 'File System Personality|Solid State|Device / Media Name'
          else
            pwsh -NoProfile -Command 'Get-CimInstance Win32_Processor | Select-Object -ExpandProperty Name; Get-CimInstance Win32_ComputerSystem | Select-Object NumberOfLogicalProcessors, TotalPhysicalMemory | Format-List; Get-Volume -DriveLetter C | Select-Object FileSystemType, Size | Format-List; Get-PhysicalDisk | Select-Object FriendlyName, MediaType | Format-List'
          fi

      # Peak RSS on macOS comes from BSD time; there is no equivalent wrapper on Windows.
      - name: Warm runs
        shell: bash
        env:
          ENTRIES: ${{ inputs.entries }}
        run: |
          run_variant() {
            if [[ $RUNNER_OS == macOS ]]; then
              /usr/bin/time -l target/release/s3-walk "$1" "$RUNNER_TEMP/tree" 2>"$RUNNER_TEMP/rss"
              awk '/maximum resident set size/ { printf "peak_rss_mib=%.1f\n", $1 / 1048576 }' "$RUNNER_TEMP/rss"
            else
              target/release/s3-walk "$1" "$RUNNER_TEMP/tree"
            fi
          }
          for variant in ignore dua rayon; do run_variant "$variant" >/dev/null; done
          {
            echo "## S3 warm, $ENTRIES entries (${{ matrix.os }})"
            echo '```text'
            for run in 1 2 3 4 5; do
              for variant in ignore dua rayon; do
                result=$(run_variant "$variant" | paste -sd' ' -)
                echo "$variant $result"
              done
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
