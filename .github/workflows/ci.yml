name: CI

on:
  push:
  pull_request:
  # Only the tapes job is the reason to dispatch by hand; every job runs.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install gate tools
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.146,cargo-machete@0.9.2,typos-cli@1.50.3

      - name: Run the gate
        run: cargo xtask check --skip deny

      - name: Scan the demo home end to end
        run: cargo xtask verify-demo

  native:
    name: native (${{ matrix.os }})
    # A hang ends the job instead of holding a runner for hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install cargo-nextest
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-nextest@0.9.146

      # The executor's mount tests need real mounts: another volume mounted inside a
      # directory, a same-device bind mount (Linux) and a FAT volume. Each is named by a
      # variable the tests read (crates/kipple-platform/tests/native/executor/mounts.rs).
      - name: Prepare test mounts (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/kipple-mounts"
          mkdir -p "$base/other/other" "$base/bind/inside" "$base/bind-source" "$base/fat"
          owner="uid=$(id -u),gid=$(id -g)"
          sudo mount -t tmpfs -o "size=64m,mode=0755,$owner" kipple-other "$base/other/other"
          sudo mount --bind "$base/bind-source" "$base/bind/inside"
          command -v mkfs.vfat >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y dosfstools
          }
          truncate -s 64M "$base/fat.img"
          mkfs.vfat "$base/fat.img"
          sudo mount -o "loop,$owner" "$base/fat.img" "$base/fat"
          {
            echo "KIPPLE_TEST_OTHER_MOUNT=$base/other"
            echo "KIPPLE_TEST_BIND_MOUNT=$base/bind"
            echo "KIPPLE_TEST_FAT=$base/fat"
          } >> "$GITHUB_ENV"

      - name: Prepare test mounts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/kipple-mounts"
          mkdir -p "$base/other/other" "$base/fat"
          hdiutil create -size 64m -fs APFS -volname KippleOther "$base/other.dmg"
          hdiutil attach -nobrowse -mountpoint "$base/other/other" "$base/other.dmg"
          hdiutil create -size 64m -fs MS-DOS -volname KIPPLEFAT "$base/fat.dmg"
          hdiutil attach -nobrowse -mountpoint "$base/fat" "$base/fat.dmg"
          {
            echo "KIPPLE_TEST_OTHER_MOUNT=$base/other"
            echo "KIPPLE_TEST_FAT=$base/fat"
          } >> "$GITHUB_ENV"

      # A Windows root is opened as itself, never through a mount point, so the other
      # volume gets a drive letter as well as its folder. ReFS is best effort: the runner
      # may not format it.
      - name: Prepare test mounts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $base = Join-Path $env:RUNNER_TEMP 'kipple-mounts'
          New-Item -ItemType Directory -Force -Path "$base\other\other" | Out-Null
          function New-TestVolume($name, $size, $format, $letter, $folder) {
            $lines = @(
              "create vdisk file=`"$base\$name.vhdx`" maximum=$size type=expandable",
              "select vdisk file=`"$base\$name.vhdx`"",
              'attach vdisk',
              'convert mbr',
              'create partition primary',
              "format fs=$format quick label=$name",
              "assign letter=$letter"
            )
            if ($folder) { $lines += "assign mount=`"$folder`"" }
            $lines | Set-Content -Path "$base\$name.txt" -Encoding ascii
            diskpart /s "$base\$name.txt" | Out-Host
            return $LASTEXITCODE -eq 0
          }
          if (-not (New-TestVolume 'other' 256 'ntfs' 'K' "$base\other\other")) { throw 'diskpart failed for NTFS' }
          if (-not (New-TestVolume 'fat' 256 'fat32' 'L' $null)) { throw 'diskpart failed for FAT32' }
          Add-Content -Path $env:GITHUB_ENV -Value "KIPPLE_TEST_OTHER_MOUNT=$base\other"
          Add-Content -Path $env:GITHUB_ENV -Value 'KIPPLE_TEST_OTHER_VOLUME=K:\'
          Add-Content -Path $env:GITHUB_ENV -Value 'KIPPLE_TEST_FAT=L:\'
          if (New-TestVolume 'refs' 4096 'refs' 'M' $null) {
            Add-Content -Path $env:GITHUB_ENV -Value 'KIPPLE_TEST_REFS=M:\'
          } else {
            Write-Warning 'ReFS is not available on this runner; its test is skipped'
          }

      # The runner VM is disposable, so the native-backend tests may read its real state.
      - name: Run the native-backend tests
        run: cargo xtask test-native
        env:
          KIPPLE_TEST_DISPOSABLE_HOST: "1"
          KIPPLE_TEST_MOUNTS_REQUIRED: "1"

  deny:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install cargo-deny
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2

      - name: Check advisories, licenses, bans and sources
        run: cargo deny check

  # The workflows and shell scripts, which `cargo xtask check` doesn't read. actionlint also
  # runs shellcheck on every `run:` block, and finds the pinned shellcheck first on PATH.
  lint:
    name: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install shellcheck and zizmor
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: shellcheck@0.11.0,zizmor@1.31.1

      # Not packaged by install-action, so downloaded and checked against its SHA-256.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/actionlint"
          tar -xzf "$archive" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Lint the shell scripts
        run: |
          shellcheck --version
          git ls-files -z -- '*.sh' .githooks | xargs -0 --no-run-if-empty shellcheck

      - name: Lint the workflows
        run: |
          actionlint -version
          actionlint

      # The token lets zizmor's online audits look up the pinned actions.
      - name: Audit the workflows and Dependabot config
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format github .

  # The vhs tapes (docs/09-site-and-docs.md §7), on `main` and on manual dispatch, until
  # the M6 site job takes them over. Not a required check. kipple runs against demo-home
  # through KIPPLE_TEST_ROOTS, and HOME and every XDG_* point at a disposable directory,
  # so neither kipple nor vhs and its browser read or write the runner's own home.
  tapes:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Install Go for vhs
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false

      - name: Install vhs, ttyd and ffmpeg
        run: |
          go install github.com/charmbracelet/vhs@24fa2254a9806091e6ee6a980e9f3bcfe0a9ba53 # v0.12.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ttyd ffmpeg
          "$(go env GOPATH)/bin/vhs" --version
          ttyd --version
          ffmpeg -version | head -n1

      - name: Build kipple with the test roots
        run: |
          cargo build --locked -p kipple --features test-roots
          echo "$GITHUB_WORKSPACE/target/debug" >> "$GITHUB_PATH"

      - name: Build demo-home and a disposable home
        env:
          TAPES: ${{ runner.temp }}/tapes
        run: |
          cargo xtask demo-home "$TAPES/demo"
          mkdir -p "$TAPES"/host/{config,cache,data,state,runtime} target/tapes
          chmod 700 "$TAPES/host/runtime"
          printf '[care]\nlevel = "balanced"\n' > "$TAPES/navigation.toml"

      # The first-scan tape shows the onboarding, which runs only when the default config
      # file is missing. Fail here, not in the middle of a recording.
      - name: Check that the first scan finds no config
        env:
          TAPES: ${{ runner.temp }}/tapes
          KIPPLE_TEST_ROOTS: ${{ runner.temp }}/tapes/demo/roots.txt
        run: |
          unset KIPPLE_CONFIG
          file="$(kipple config path)"
          echo "default config file: $file"
          case "$file" in
            "$TAPES/demo/"*) ;;
            *) echo "the config file is outside demo-home"; exit 1 ;;
          esac
          dir="$(dirname "$file")"
          if [ -e "$dir" ] && [ -n "$(ls -A "$dir")" ]; then
            echo "$dir is not empty"
            exit 1
          fi
          kipple config show | grep -F 'not present, the defaults apply'

      - name: Render the tapes
        env:
          TAPES: ${{ runner.temp }}/tapes
          KIPPLE_TEST_ROOTS: ${{ runner.temp }}/tapes/demo/roots.txt
          HOME: ${{ runner.temp }}/tapes/host
          XDG_CONFIG_HOME: ${{ runner.temp }}/tapes/host/config
          XDG_CACHE_HOME: ${{ runner.temp }}/tapes/host/cache
          XDG_DATA_HOME: ${{ runner.temp }}/tapes/host/data
          XDG_STATE_HOME: ${{ runner.temp }}/tapes/host/state
          XDG_RUNTIME_DIR: ${{ runner.temp }}/tapes/host/runtime
          # The browser only shows the local ttyd page on a disposable VM.
          VHS_NO_SANDBOX: "true"
        run: |
          unset KIPPLE_CONFIG
          vhs validate site/tapes/*.tape
          for tape in site/tapes/*.tape; do
            vhs "$tape"
          done

      - name: Upload the recordings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tapes
          path: target/tapes/
          retention-days: 14
