schema_version = 1

[pack]
id = "builtin.git"
version = "1.0.0"
publisher = "kipple"
description = "Git worktrees, whichever agent left them"
license = "MIT"
kipple = ">=0.0.0"
platforms = ["linux", "macos", "windows"]

[[rule]]
id = "builtin.git.worktree-remove"
integration = "git"
title = "Linked git worktrees"
description = "A linked worktree that is registered and present."
why = "Agents create git worktrees and often leave them behind."
loss = "The checkout and its ignored files. Its branch stays."
references = ["https://git-scm.com/docs/git-worktree"]
category = "source-worktree"
platforms = ["linux"]

[rule.scope]
root = "config.project-roots"
selection = "registered-linked-worktrees"

[rule.requirements]
"worktree.linked" = true
"worktree.removal_git" = "supported"
repository_identity = "verified"
registration_state = "registered-present"
"worktree.config_gate" = "clear"
git_inventory = "complete"
storage_availability = "available"
activity = "idle"

[rule.eligibility]
"worktree.locked" = false
"worktree.submodules" = false
"git.tracked_changes" = "absent"
"git.untracked_files" = "absent"
"git.hidden_changes" = "absent"
"worktree.unclassified_ignored" = "absent"
"worktree.operation_in_progress" = false
"worktree.per_worktree_refs" = "absent"
"worktree.index_locked" = false
"worktree.head_reachable" = true
"worktree.unreferenced_commits" = "absent"
"worktree.own_config" = false
"worktree.unknown_admin_entries" = "absent"

[rule.operation]
kind = "git-worktree-remove"

[[rule]]
id = "builtin.git.worktree-inventory"
integration = "git"
title = "Linked git worktrees, reported only"
description = "A registered worktree kipple doesn't remove here: off Linux, or outside every root it opened."
why = "Agents create git worktrees and often leave them behind."
loss = "Nothing. Report only."
references = ["https://git-scm.com/docs/git-worktree"]
category = "source-worktree"

[rule.scope]
root = "config.project-roots"
selection = "registered-linked-worktrees"

[rule.operation]
kind = "report"

[[rule]]
id = "builtin.git.worktree-anomalies"
integration = "git"
title = "Worktrees needing review"
description = "A registration that is missing its checkout, a checkout no repository lists, or one that doesn't match its registration."
why = "Agents create git worktrees and often leave them behind."
loss = "Nothing. Report only."
references = ["https://git-scm.com/docs/git-worktree"]
category = "source-worktree"

[rule.scope]
root = "config.project-roots"
selection = "worktree-registrations"

[rule.operation]
kind = "report"
