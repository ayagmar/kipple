# kipple's brand palette (assets/brand/BRAND.md) for dark terminals, in 24-bit
# colour; a terminal with fewer colours gets the nearest it has. Amber is kept
# for what you keep.
version = 1

[roles]
text = { fg = "#F4EADE" }
muted = { fg = "#8A8178" }
accent = { fg = "#CA8848" }
border = { fg = "#5A4234" }
title = { fg = "#F4EADE", bold = true }
label = { fg = "#F4EADE", bold = true }
cursor = { bg = "#3A3F4B" }
selected = { fg = "#CA8848" }
safe = { fg = "#8CC084" }
review = { fg = "#D9C36A" }
protected = { fg = "#86A9CF" }
warning = { fg = "#D9C36A" }
error = { fg = "#E0705F" }
"bar.safe" = { fg = "#8CC084" }
"bar.review" = { fg = "#D9C36A" }
"bar.protected" = { fg = "#86A9CF" }
"bar.track" = { bg = "#2B2F38" }
key = { fg = "#F4EADE", bold = true }
"key.label" = { fg = "#8A8178" }
"level.current" = { fg = "#CA8848", bold = true }
"level.other" = { fg = "#8A8178" }
kept = { fg = "#F2A23A" }
